name: covid_tracker_19
description: A Flutter application for tracking global and country-specific COVID-19 statistics.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_messaging: ^15.2.5
  mailer: ^6.2.0
  image_picker: ^1.1.2

  # Networking
  http: ^1.2.2

  # UI and animations
  flutter_spinkit: ^5.2.1
  pie_chart: ^5.4.0
  shimmer: ^3.0.0

  # Location and Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0

  # Local storage
  shared_preferences: ^2.3.2

  # Firebase dependencies
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1

  # News API and URL launching
  url_launcher: ^6.3.0

  # Charts for trends
  fl_chart: ^0.68.0

  # Consistent icons
  cupertino_icons: ^1.0.8
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon1.png"

flutter:
  uses-material-design: true

  assets:
    - images/virus.png